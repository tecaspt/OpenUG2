# Codemagic CI for the OpenUG2 iOS/iPadOS port.
#
#   ios-testflight  signed IPA uploaded to App Store Connect. Runs automatically on
#                   every push to the ios/main branch.
#   ios-compile     unsigned device build for fast compile checks. Manual only.
#
# The Xcode project is generated by XcodeGen from ios/project.yml, never committed.

definitions:
  env_versions: &env_versions
    # Pinned. Never `latest`: Xcode 27 builds against the iOS 27 SDK, which requires
    # the UIScene lifecycle, and SDL2 2.32 does not implement it, so the app would
    # not launch. Raise this only after the SDL side supports UIScene.
    xcode: "26.6"
    vars:
      BUNDLE_ID: "com.tecaspt.openug2"
      XCODE_PROJECT: "ios/OpenUG2.xcodeproj"
      XCODE_SCHEME: "OpenUG2"
      # Apple's own id for the app, used to ask App Store Connect what build number
      # it already has. Not the Codemagic app id, which is a different thing.
      APP_STORE_APP_ID: "6834421460"

  # A YAML merge key cannot splice one list into another, so each shared step is
  # anchored separately and listed explicitly in every workflow that needs it.
  scripts:
    - &install_tools
      name: Install XcodeGen and Ninja if the image does not ship them
      script: |
        set -e
        command -v xcodegen >/dev/null 2>&1 || brew install xcodegen
        command -v ninja >/dev/null 2>&1 || brew install ninja
        command -v cmake >/dev/null 2>&1 || brew install cmake
        xcodegen --version
        cmake --version | head -1

    - &generate_shaders
      name: Generate the embedded shader headers
      script: |
        set -e
        make src/generated_shaders.h src/generated_world_debug_shaders.h

    - &build_deps
      name: Build SDL2 and libpng for iOS
      script: |
        set -e
        bash ios/build-deps.sh

    - &make_icon
      name: Generate the app icon
      script: |
        set -e
        python3 ios/tools/make_icon.py ios/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png

    - &generate_project
      name: Generate the Xcode project
      script: |
        set -e
        (cd ios && xcodegen generate)
        ls -d "$XCODE_PROJECT"

workflows:
  ios-testflight:
    name: iOS app - TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 120
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: ios/main
          include: true
          source: true
    integrations:
      # Exact name of the App Store Connect API key attached to this Codemagic team
      # (Teams > Integrations > Developer Portal). Codemagic resolves it at parse
      # time and fails immediately if it does not match.
      app_store_connect: "1"
    environment:
      <<: *env_versions
      groups:
        # Variable group holding CERTIFICATE_PRIVATE_KEY, which fetch-signing-files
        # needs to pair with the existing distribution certificate. (This is a
        # group *named* ios_signing, not the reserved environment.ios_signing key,
        # which is deliberately absent: that form only looks up an existing
        # provisioning profile and fails before any script runs when a bundle id
        # has never been built. Signing is done explicitly below so the profile
        # can be created on first use.)
        - ios_signing
    scripts:
      - *install_tools
      - *generate_shaders
      - *build_deps
      - *make_icon
      - *generate_project
      - name: Set up code signing
        script: |
          set -eo pipefail
          exec > >(tee "$CM_BUILD_DIR/signing.log") 2>&1

          # Report which signing variables are visible. Names and lengths only.
          echo "--- signing variables visible to this build ---"
          for v in CERTIFICATE_PRIVATE_KEY CM_CERTIFICATE CM_CERTIFICATE_PASSWORD \
                   APP_STORE_CONNECT_PRIVATE_KEY APP_STORE_CONNECT_KEY_IDENTIFIER \
                   APP_STORE_CONNECT_ISSUER_ID; do
            val="${!v:-}"
            if [ -n "$val" ]; then echo "  $v: set (${#val} chars)"; else echo "  $v: not set"; fi
          done
          echo "-----------------------------------------------"

          keychain initialize

          # --create makes the App Store provisioning profile for this bundle id on
          # first use. The certificate is always an existing one.
          if [ -n "${CERTIFICATE_PRIVATE_KEY:-}" ]; then
            echo "Using CERTIFICATE_PRIVATE_KEY"
            app-store-connect fetch-signing-files "$BUNDLE_ID" \
              --type IOS_APP_STORE \
              --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
              --create
          elif [ -n "${CM_CERTIFICATE:-}" ]; then
            # Certificate stored as a base64 .p12. Pull the private key out of it.
            echo "Using CM_CERTIFICATE (.p12), extracting its private key"
            printf '%s' "$CM_CERTIFICATE" | base64 --decode > /tmp/cert.p12
            openssl pkcs12 -legacy -in /tmp/cert.p12 -nodes -nocerts \
              -passin pass:"${CM_CERTIFICATE_PASSWORD:-}" -out /tmp/cert_key.pem 2>/dev/null \
              || openssl pkcs12 -in /tmp/cert.p12 -nodes -nocerts \
                   -passin pass:"${CM_CERTIFICATE_PASSWORD:-}" -out /tmp/cert_key.pem
            app-store-connect fetch-signing-files "$BUNDLE_ID" \
              --type IOS_APP_STORE \
              --certificate-key=@file:/tmp/cert_key.pem \
              --create
            rm -f /tmp/cert.p12 /tmp/cert_key.pem
          else
            echo "No certificate private key is available to this workflow." >&2
            echo >&2
            echo "It must be a *stored* key: generating a fresh key per build would" >&2
            echo "mint a new Apple Distribution certificate every run and exhaust" >&2
            echo "Apple's limit. Generate one and store it in Codemagic:" >&2
            echo >&2
            echo "  ssh-keygen -t rsa -b 2048 -m PEM -f cert_key -q -N ''" >&2
            echo >&2
            echo "then add the contents of 'cert_key' as a secure variable named" >&2
            echo "CERTIFICATE_PRIVATE_KEY in the ios_signing group." >&2
            echo >&2
            echo "--- existing distribution certificates (read-only) ---" >&2
            app-store-connect certificates list --type IOS_DISTRIBUTION 2>&1 | head -40 >&2 || true
            exit 1
          fi

          keychain add-certificates
          xcode-project use-profiles
      - name: Set the build number from what App Store Connect already has
        script: |
          set -e
          # CFBundleVersion must strictly increase, and Apple is the authority on
          # what was already uploaded. Not $BUILD_NUMBER alone: that counter is
          # per Codemagic account. The max() keeps it monotonic if the query fails.
          latest="$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APP_ID" 2>/dev/null || echo 0)"
          case "$latest" in
            ''|*[!0-9]*) latest=0 ;;
          esac
          next=$((latest + 1))
          if [ "$next" -lt "$BUILD_NUMBER" ]; then
            next="$BUILD_NUMBER"
          fi
          echo "latest on App Store Connect: $latest; CI counter: $BUILD_NUMBER; using: $next"

          # Must come after `xcodegen generate`.
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $next" ios/Info.plist
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" ios/Info.plist
      - name: Build the signed IPA
        script: |
          set -eo pipefail
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" 2>&1 | tee "$CM_BUILD_DIR/ipa.log"
    artifacts:
      - build/ios/ipa/*.ipa
      # Published even on failure, so signing or archive problems are visible.
      - $CM_BUILD_DIR/ipa.log
      - $CM_BUILD_DIR/signing.log
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Upload only. Builds reach internal testers as soon as Apple finishes
        # processing them, with no review. true would submit for EXTERNAL beta
        # review, which Apple refuses until Beta App Information is filled in at
        # App Store Connect -> your app -> TestFlight -> Test Information.
        submit_to_testflight: false
        # No beta_groups: Apple rejects assigning a build to an internal group
        # ("Builds cannot be assigned to this internal group") because internal
        # groups receive every build automatically.

  ios-compile:
    name: iOS app - compile check (unsigned)
    instance_type: mac_mini_m2
    max_build_duration: 90
    # No `triggering:` block: runs only when started manually from the Codemagic UI.
    environment:
      <<: *env_versions
    scripts:
      - *install_tools
      - *generate_shaders
      - *build_deps
      - *make_icon
      - *generate_project
      - name: Build for device without signing
        script: |
          set -eo pipefail
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$CM_BUILD_DIR/xcodebuild.log"
    artifacts:
      - $CM_BUILD_DIR/xcodebuild.log
      - /tmp/xcodebuild_logs/*.log
